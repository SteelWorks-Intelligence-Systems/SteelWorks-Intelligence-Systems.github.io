name: Deploy to Cloudflare Workers

on:
  # Manual only. GitHub Pages deploys this static site automatically from main.
  # Running Wrangler on every website push fails without a Worker entry point and wastes free CI minutes.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
