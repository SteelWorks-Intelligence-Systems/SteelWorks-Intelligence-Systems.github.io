<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>offer-landing-section</title>
  <style>
    body { margin:0; width:1200px; min-height:630px; background:#081018; color:#f5fbff; font-family:Inter, system-ui, sans-serif; display:grid; place-items:center; }
    .frame { width:1080px; min-height:520px; border:2px solid #00e0c7; padding:56px; display:flex; flex-direction:column; justify-content:space-between; }
    h1 { font-size:62px; line-height:1.02; margin:0; letter-spacing:0; }
    p { font-size:28px; line-height:1.3; color:#bdd0df; max-width:900px; }
    .footer { display:flex; justify-content:space-between; color:#00e0c7; font-weight:700; font-size:24px; }
  </style>
</head>
<body>
  <section class="frame">
    <div>
      <h1>{hook}</h1>
      <p>{proof_metric} {supporting_point}</p>
    </div>
    <div class="footer"><span>SteelWorks Intelligence</span><span>{cta}</span></div>
  </section>
</body>
</html>
