<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="A structural AI system: governance, teams, agents, models, with security through all four"><rect width="1200" height="820" fill="#151a21"/><line x1="60" y1="0" x2="60" y2="820" stroke="#252d36" stroke-width="1"/><line x1="120" y1="0" x2="120" y2="820" stroke="#252d36" stroke-width="1"/><line x1="180" y1="0" x2="180" y2="820" stroke="#252d36" stroke-width="1"/><line x1="240" y1="0" x2="240" y2="820" stroke="#252d36" stroke-width="1"/><line x1="300" y1="0" x2="300" y2="820" stroke="#252d36" stroke-width="1"/><line x1="360" y1="0" x2="360" y2="820" stroke="#252d36" stroke-width="1"/><line x1="420" y1="0" x2="420" y2="820" stroke="#252d36" stroke-width="1"/><line x1="480" y1="0" x2="480" y2="820" stroke="#252d36" stroke-width="1"/><line x1="540" y1="0" x2="540" y2="820" stroke="#252d36" stroke-width="1"/><line x1="600" y1="0" x2="600" y2="820" stroke="#252d36" stroke-width="1"/><line x1="660" y1="0" x2="660" y2="820" stroke="#252d36" stroke-width="1"/><line x1="720" y1="0" x2="720" y2="820" stroke="#252d36" stroke-width="1"/><line x1="780" y1="0" x2="780" y2="820" stroke="#252d36" stroke-width="1"/><line x1="840" y1="0" x2="840" y2="820" stroke="#252d36" stroke-width="1"/><line x1="900" y1="0" x2="900" y2="820" stroke="#252d36" stroke-width="1"/><line x1="960" y1="0" x2="960" y2="820" stroke="#252d36" stroke-width="1"/><line x1="1020" y1="0" x2="1020" y2="820" stroke="#252d36" stroke-width="1"/><line x1="1080" y1="0" x2="1080" y2="820" stroke="#252d36" stroke-width="1"/><line x1="1140" y1="0" x2="1140" y2="820" stroke="#252d36" stroke-width="1"/><line x1="0" y1="60" x2="1200" y2="60" stroke="#252d36" stroke-width="1"/><line x1="0" y1="120" x2="1200" y2="120" stroke="#252d36" stroke-width="1"/><line x1="0" y1="180" x2="1200" y2="180" stroke="#252d36" stroke-width="1"/><line x1="0" y1="240" x2="1200" y2="240" stroke="#252d36" stroke-width="1"/><line x1="0" y1="300" x2="1200" y2="300" stroke="#252d36" stroke-width="1"/><line x1="0" y1="360" x2="1200" y2="360" stroke="#252d36" stroke-width="1"/><line x1="0" y1="420" x2="1200" y2="420" stroke="#252d36" stroke-width="1"/><line x1="0" y1="480" x2="1200" y2="480" stroke="#252d36" stroke-width="1"/><line x1="0" y1="540" x2="1200" y2="540" stroke="#252d36" stroke-width="1"/><line x1="0" y1="600" x2="1200" y2="600" stroke="#252d36" stroke-width="1"/><line x1="0" y1="660" x2="1200" y2="660" stroke="#252d36" stroke-width="1"/><line x1="0" y1="720" x2="1200" y2="720" stroke="#252d36" stroke-width="1"/><line x1="0" y1="780" x2="1200" y2="780" stroke="#252d36" stroke-width="1"/><text x="48" y="64" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#e3a83b" text-anchor="start" font-weight="normal" letter-spacing="3">WHAT A STRUCTURAL AI SYSTEM IS MADE OF</text><text x="48" y="104" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="30" fill="#eceff2" text-anchor="start" font-weight="bold" >Four layers. A security function through all of them.</text><rect x="48" y="165" width="800" height="132" fill="#252d36" stroke="#4a5361" stroke-width="1"/><text x="72" y="211" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="30" fill="#e3a83b" text-anchor="start" font-weight="bold" >01</text><text x="134" y="209" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eceff2" text-anchor="start" font-weight="bold" >Governance</text><text x="134" y="241" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#a9b1ba" text-anchor="start" font-weight="normal" >Decision rights, approval gates, escalation. Who may decide</text><text x="134" y="263" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#a9b1ba" text-anchor="start" font-weight="normal" >what, written down.</text><text x="134" y="281" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#5fb4cf" text-anchor="start" font-weight="normal" >17 units with named decision rights</text><rect x="48" y="311" width="800" height="132" fill="#252d36" stroke="#4a5361" stroke-width="1"/><text x="72" y="357" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="30" fill="#e3a83b" text-anchor="start" font-weight="bold" >02</text><text x="134" y="355" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eceff2" text-anchor="start" font-weight="bold" >Teams</text><text x="134" y="387" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#a9b1ba" text-anchor="start" font-weight="normal" >Cross-functional units assembled per operation, not per tool.</text><text x="134" y="427" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#5fb4cf" text-anchor="start" font-weight="normal" >62 specialists placed by role</text><rect x="48" y="457" width="800" height="132" fill="#252d36" stroke="#4a5361" stroke-width="1"/><text x="72" y="503" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="30" fill="#e3a83b" text-anchor="start" font-weight="bold" >03</text><text x="134" y="501" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eceff2" text-anchor="start" font-weight="bold" >Agents</text><text x="134" y="533" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#a9b1ba" text-anchor="start" font-weight="normal" >One job each, a tool scope they cannot exceed, a report line.</text><text x="134" y="573" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#5fb4cf" text-anchor="start" font-weight="normal" >deny-lists enforced per agent</text><rect x="48" y="603" width="800" height="132" fill="#252d36" stroke="#4a5361" stroke-width="1"/><text x="72" y="649" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="30" fill="#e3a83b" text-anchor="start" font-weight="bold" >04</text><text x="134" y="647" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eceff2" text-anchor="start" font-weight="bold" >Models</text><text x="134" y="679" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#a9b1ba" text-anchor="start" font-weight="normal" >The strongest model for each task, chosen on measured score.</text><text x="134" y="719" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#5fb4cf" text-anchor="start" font-weight="normal" >scored continuously, re-routed on evidence</text><rect x="874" y="165" width="278" height="570" fill="#252d36" stroke="#e3a83b" stroke-width="2"/><text x="896" y="209" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#e3a83b" text-anchor="start" font-weight="bold" >Security</text><text x="896" y="235" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#e3a83b" text-anchor="start" font-weight="bold" >&amp; governance</text><text x="896" y="281" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#a9b1ba" text-anchor="start" font-weight="normal" >Runs through every</text><text x="896" y="303" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#a9b1ba" text-anchor="start" font-weight="normal" >layer, not bolted to</text><text x="896" y="325" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#a9b1ba" text-anchor="start" font-weight="normal" >one. Permissions,</text><text x="896" y="347" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#a9b1ba" text-anchor="start" font-weight="normal" >approval gates, secret</text><text x="896" y="369" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#a9b1ba" text-anchor="start" font-weight="normal" >handling,</text><text x="896" y="391" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#a9b1ba" text-anchor="start" font-weight="normal" >inbound-content abuse,</text><text x="896" y="413" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#a9b1ba" text-anchor="start" font-weight="normal" >logging.</text><text x="896" y="693" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="26" fill="#eceff2" text-anchor="start" font-weight="bold" >25 controls</text><text x="896" y="717" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#a9b1ba" text-anchor="start" font-weight="normal" >measured weekly</text><text x="48" y="786" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#a9b1ba" text-anchor="start" font-weight="normal" >drawn from data/org/org.json + the security scorecard · 2026-09-11</text><rect x="0.5" y="0.5" width="1199" height="819" fill="none" stroke="#5fb4cf" stroke-width="1"/></svg>
